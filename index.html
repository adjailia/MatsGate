<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- تحسينات SEO الأساسية -->
  <title>Mets Gate - Comparateur de Parfums et Soins</title>
  <meta name="description" content="Comparez les meilleurs parfums, cosmétiques et soins de santé. Trouvez les meilleurs prix et produits en un instant sur Mets Gate.">
  <meta name="robots" content="index, follow">
  
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <header>
    <div class="container header-content">
      <img src="images/LOGO_150.png" alt="MetsGate Logo" class="logo">
      <div class="header-text">
        <h1>Comparateur de produits</h1>
        <p class="subtitle">Trouvez les meilleurs parfums et soins</p>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- شريط الفلتر والبحث -->
    <section class="filters">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Rechercher un produit, une marque...">
        <button id="searchBtn"><i class="fas fa-search"></i></button>
      </div>
      <div class="filter-options">
        <select id="brandFilter">
          <option value="">Toutes les marques</option>
        </select>
        <select id="categoryFilter">
          <option value="">Toutes les catégories</option>
        </select>
        <button id="clearFilters" class="clear-btn"><i class="fas fa-times"></i> Effacer les filtres</button>
      </div>
    </section>

    <!-- مؤشر التحميل (Loading Spinner) -->
    <div id="loadingSpinner" class="spinner-container">
      <div class="spinner"></div>
      <p>Chargement des produits...</p>
    </div>

    <!-- شبكة المنتجات -->
    <section id="productGrid" class="product-grid">
      <!-- سيتم توليدها بواسطة JavaScript -->
    </section>

    <!-- أزرار التنقل بين الصفحات (Pagination) -->
    <div id="paginationControls" class="pagination-controls">
      <button id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i> Précédent</button>
      <span id="pageInfo">Page 1</span>
      <button id="nextPageBtn">Suivant <i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- شريط المقارنة الثابت -->
    <div id="compareBar" class="compare-bar">
      <span id="selectionCount">0 produit(s) sélectionné(s)</span>
      <div class="compare-actions">
        <button id="clearSelectionBtn" class="clear-selection-btn" title="Désélectionner tout">
          <i class="fas fa-times-circle"></i> Tout désélectionner
        </button>
        <button id="compareBtn" disabled>Comparer les produits</button>
      </div>
    </div>

  </main>

  <!-- مودال المقارنة -->
  <div id="compareModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Comparaison des produits</h2>
      <div id="compareTableContainer">
        <!-- سيتم توليدها بواسطة JavaScript -->
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 MetsGate – Comparateur indépendant. Les liens sont affiliés.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
