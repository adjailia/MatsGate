<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparateur de produits - MetsGate</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <header>
    <div class="container header-content">
      <div class="logo-section">
        <img src="images/logo.png" alt="MetsGate Logo" class="logo">
        <span class="logo-text">Mets Gate</span>
      </div>
      <div class="header-text">
        <h1>Comparateur de produits</h1>
        <p class="subtitle">Trouvez les meilleurs parfums et soins</p>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Barre de recherche et filtres -->
    <section class="filters">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Rechercher un produit, une marque...">
        <button id="searchBtn"><i class="fas fa-search"></i></button>
      </div>
      <div class="filter-options">
        <select id="brandFilter">
          <option value="">Toutes les marques</option>
        </select>
        <select id="categoryFilter">
          <option value="">Toutes les catégories</option>
        </select>
        <button id="clearFilters" class="clear-btn"><i class="fas fa-times"></i> Effacer les filtres</button>
      </div>
    </section>

    <!-- Grille de produits -->
    <section id="productGrid" class="product-grid">
      <!-- Les cartes produits seront générées par JavaScript -->
    </section>

    <!-- Bouton de comparaison flottant -->
    <div id="compareBar" class="compare-bar">
      <span id="selectionCount">0 produit(s) sélectionné(s)</span>
      <button id="compareBtn" disabled>Comparer les produits</button>
    </div>

  </main>

  <!-- Modale de comparaison -->
  <div id="compareModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Comparaison des produits</h2>
      <div id="compareTableContainer">
        <!-- Le tableau sera généré par JavaScript -->
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 MetsGate – Comparateur indépendant. Les liens sont affiliés.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
